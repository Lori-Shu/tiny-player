[package]
name = "tiny-player"
version = "0.1.6"
edition = "2024"
description = "a tiny media player"
authors = ["Lori-Shu"]

[dependencies]
media_engine = "0.1.0"
ffmpeg-the-third = "6.0.0"
flume = "0.12.0"
rodio = "0.22.2"
bytemuck = "1.22.0"
image = { version = "0.25.9", features = ["jpeg", "png"] }
#egui dep list
eframe = { version = "0.35.0", features = ["wgpu"] }
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["image"] }
#
glam = "0.32.1"
egui-file-dialog = "0.14.0"
egui_tiles = "0.16.0"
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.22",features = ["local-time"]}
time = { version = "0.3.55", features = ["formatting","local-offset"] }
keepawake = "0.6.0"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = {version="0.13.2",features=["form","stream","multipart","json"]}
# reqwest-websocket = "0.5.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
typed-builder = "0.23.2"
anyhow = "1.0.104"
quick-m3u8 = "0.8.0"
futures-util = "0.3.32"
tokio-util = "0.7.19"
hound = "3.5.1"
rustfft = "6.4.1"
[dev-dependencies]
num-complex = "0.4.6"

[build-dependencies]
winresource = "0.1.29"

[[test]]
name = "tile_demo"
harness = false